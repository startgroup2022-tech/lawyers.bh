# Codemagic CI/CD Configuration for Lawyers.bh
# https://docs.codemagic.io/getting-started/yaml/

workflows:
  # Android Workflows
  android-debug:
    name: Android Debug Build
    instance_type: mac_pro
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Setup environment
        script: |
          echo "Setting up development environment..."
          cp .env.development .env
      - name: Get dependencies
        script: |
          flutter pub get
      - name: Generate code
        script: |
          dart run build_runner build --delete-conflicting-outputs
      - name: Run tests
        script: |
          flutter test --coverage
      - name: Run static analysis
        script: |
          flutter analyze
      - name: Build Android Debug APK
        script: |
          flutter build apk --debug --flavor development
    artifacts:
      - build/app/outputs/flutter-apk/app-development-debug.apk
    publishing:
      email:
        recipients:
          - dev-team@lawyers.bh
        notify:
          success: true
          failure: true

  android-staging:
    name: Android Staging Release
    instance_type: mac_pro
    max_build_duration: 45
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Setup environment
        script: |
          echo "Setting up staging environment..."
          cp .env.staging .env
      - name: Get dependencies
        script: |
          flutter pub get
      - name: Generate code
        script: |
          dart run build_runner build --delete-conflicting-outputs
      - name: Run tests
        script: |
          flutter test --coverage
      - name: Run static analysis
        script: |
          flutter analyze
      - name: Build Android Release AAB
        script: |
          flutter build appbundle --release --flavor staging
    artifacts:
      - build/app/outputs/bundle/stagingRelease/app-staging-release.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_KEY
        track: internal
        submit_as_draft: true
      email:
        recipients:
          - qa-team@lawyers.bh
        notify:
          success: true
          failure: true

  android-production:
    name: Android Production Release
    instance_type: mac_pro
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Setup environment
        script: |
          echo "Setting up production environment..."
          # Environment variables are injected from Codemagic UI
      - name: Get dependencies
        script: |
          flutter pub get
      - name: Generate code
        script: |
          dart run build_runner build --delete-conflicting-outputs
      - name: Run tests
        script: |
          flutter test --coverage
      - name: Run static analysis
        script: |
          flutter analyze
      - name: Build Android Release AAB
        script: |
          flutter build appbundle --release --flavor production
    artifacts:
      - build/app/outputs/bundle/productionRelease/app-production-release.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_KEY
        track: production
        submit_as_draft: false
      email:
        recipients:
          - release-team@lawyers.bh
        notify:
          success: true
          failure: true

  # iOS Workflows
  ios-debug:
    name: iOS Debug Build
    instance_type: mac_pro
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Setup environment
        script: |
          echo "Setting up development environment..."
          cp .env.development .env
      - name: Get dependencies
        script: |
          flutter pub get
      - name: Generate code
        script: |
          dart run build_runner build --delete-conflicting-outputs
      - name: Run tests
        script: |
          flutter test --coverage
      - name: Run static analysis
        script: |
          flutter analyze
      - name: Build iOS Debug
        script: |
          flutter build ios --debug --flavor development --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app
    publishing:
      email:
        recipients:
          - dev-team@lawyers.bh
        notify:
          success: true
          failure: true

  ios-staging:
    name: iOS Staging Release
    instance_type: mac_pro
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Setup environment
        script: |
          echo "Setting up staging environment..."
          cp .env.staging .env
      - name: Get dependencies
        script: |
          flutter pub get
      - name: Generate code
        script: |
          dart run build_runner build --delete-conflicting-outputs
      - name: Run tests
        script: |
          flutter test --coverage
      - name: Run static analysis
        script: |
          flutter analyze
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Build iOS Release
        script: |
          flutter build ios --release --flavor staging --no-codesign
      - name: Create IPA
        script: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner-staging \
            -configuration Release-staging \
            -archivePath build/Runner.xcarchive \
            -allowProvisioningUpdates \
            archive
          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist
    artifacts:
      - build/ios/ipa/Runner.ipa
    publishing:
      testflight:
        api_key: $APP_STORE_CONNECT_API_KEY
        api_key_id: $APP_STORE_CONNECT_API_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
      email:
        recipients:
          - qa-team@lawyers.bh
        notify:
          success: true
          failure: true

  ios-production:
    name: iOS Production Release
    instance_type: mac_pro
    max_build_duration: 90
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Setup environment
        script: |
          echo "Setting up production environment..."
          # Environment variables are injected from Codemagic UI
      - name: Get dependencies
        script: |
          flutter pub get
      - name: Generate code
        script: |
          dart run build_runner build --delete-conflicting-outputs
      - name: Run tests
        script: |
          flutter test --coverage
      - name: Run static analysis
        script: |
          flutter analyze
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Build iOS Release
        script: |
          flutter build ios --release --flavor production --no-codesign
      - name: Create IPA
        script: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner-production \
            -configuration Release-production \
            -archivePath build/Runner.xcarchive \
            -allowProvisioningUpdates \
            archive
          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist
    artifacts:
      - build/ios/ipa/Runner.ipa
    publishing:
      testflight:
        api_key: $APP_STORE_CONNECT_API_KEY
        api_key_id: $APP_STORE_CONNECT_API_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
      email:
        recipients:
          - release-team@lawyers.bh
        notify:
          success: true
          failure: true

  # Combined Workflows
  full-test:
    name: Full Test Suite
    instance_type: mac_pro
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get dependencies
        script: |
          flutter pub get
      - name: Generate code
        script: |
          dart run build_runner build --delete-conflicting-outputs
      - name: Run unit tests
        script: |
          flutter test test/unit --coverage
      - name: Run widget tests
        script: |
          flutter test test/widget --coverage
      - name: Run integration tests
        script: |
          flutter test test/integration --coverage
      - name: Run static analysis
        script: |
          flutter analyze
      - name: Check formatting
        script: |
          dart format --output=none --set-exit-if-changed lib test
    artifacts:
      - coverage/lcov.info

  # PR Validation
  pr-validation:
    name: PR Validation
    instance_type: mac_pro
    max_build_duration: 20
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    scripts:
      - name: Get dependencies
        script: |
          flutter pub get
      - name: Generate code
        script: |
          dart run build_runner build --delete-conflicting-outputs
      - name: Run tests
        script: |
          flutter test --coverage
      - name: Run static analysis
        script: |
          flutter analyze
      - name: Check formatting
        script: |
          dart format --output=none --set-exit-if-changed lib test

# Environment variables (set in Codemagic UI)
# GCLOUD_SERVICE_ACCOUNT_KEY - Google Play service account JSON
# APP_STORE_CONNECT_API_KEY - App Store Connect API key
# APP_STORE_CONNECT_API_KEY_ID - API key ID
# APP_STORE_CONNECT_ISSUER_ID - Issuer ID
# KEYSTORE_PASSWORD - Android keystore password
# KEY_PASSWORD - Android key password
# CM_KEYSTORE - Base64 encoded keystore file
# CM_PROVISIONING_PROFILE - Base64 encoded provisioning profile
# CM_CERTIFICATE - Base64 encoded certificate
# CM_CERTIFICATE_PASSWORD - Certificate password