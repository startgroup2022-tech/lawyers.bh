# Codemagic CI/CD for Lawyers.bh - Flutter Web build
# Codemagic mac_mini_m2 has Flutter preinstalled, so no local SDK is needed.

workflows:
  web:
    name: Flutter Web Release
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: stable
    cache:
      cache_paths:
        - .dart_tool
        - .pub-cache
    scripts:
      - name: Setup environment
        script: |
          echo "Setting up development environment..."
          cp .env.development .env
      - name: Generate web platform files
        script: |
          flutter config --enable-web
          flutter create --platforms=web --project-name lawyers_bh web
      - name: Get dependencies
        script: |
          flutter pub get
      - name: Generate code (build_runner)
        script: |
          dart run build_runner build --delete-conflicting-outputs
      - name: Build web release
        script: |
          flutter build web --release
      - name: Package web output
        script: |
          cd build/web
          zip -qr ../../lawyers_bh-web.zip .
          cd ../..
    artifacts:
      - lawyers_bh-web.zip
      - build/web/**
    publishing:
      email:
        recipients:
          - dev-team@lawyers.bh
        notify:
          success: true
          failure: true
