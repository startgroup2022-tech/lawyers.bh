name: lawyers_bh_client
description: "محامون البحرين — واجهة العميل (Client interface for the Lawyers.bh platform)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.20.3
  signature: ^5.5.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    # The square brand seal used in app bars and the sign-in header. Declared
    # individually so the other, unused artwork in this folder is not bundled.
    - assets/images/logo_bh.png
    # Bundled default background image. Ships in the APK so the global app
    # background is visible even before an admin configures one, and offline.
    - assets/images/app_background_default.png
